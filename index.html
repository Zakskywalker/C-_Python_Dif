<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C# // PYTHON TERMINAL REFERENCE &amp; DSA MATRIX</title>
  <style>
    :root {
      --bg-core: #040704;
      --bg-panel: #081008;
      --bg-card: #0b160b;
      --bg-code: #030603;
      --fg-primary: #00ff41;
      --fg-bright: #7dff9b;
      --fg-muted: #4ead61;
      --fg-dim: #266332;
      --border-green: #14491e;
      --border-bright: #00ff41;
      --accent-amber: #ffb000;
      --accent-cyan: #00e5ff;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-core);
      color: var(--fg-primary);
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.5;
      background-image: radial-gradient(rgba(0, 255, 65, 0.04) 1px, transparent 0);
      background-size: 20px 20px;
      padding-bottom: 60px;
    }

    /* Sticky Terminal Top Navigation */
    .terminal-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(4, 9, 4, 0.96);
      border-bottom: 2px solid var(--fg-primary);
      box-shadow: 0 4px 20px rgba(0, 255, 65, 0.15);
      padding: 12px 20px;
      backdrop-filter: blur(6px);
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--fg-bright);
      text-shadow: 0 0 8px rgba(0, 255, 65, 0.5);
    }

    .brand-title span.cursor {
      display: inline-block;
      width: 9px;
      height: 16px;
      background: var(--fg-primary);
      vertical-align: middle;
      margin-left: 4px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .terminal-input,
    .terminal-select,
    .terminal-btn {
      background: var(--bg-code);
      color: var(--fg-primary);
      border: 1px solid var(--fg-muted);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      padding: 6px 10px;
      outline: none;
      transition: all 0.15s ease;
    }

    .terminal-select[multiple] {
      min-width: 190px;
      max-height: 100px;
    }

    .print-sections-control[hidden] {
      display: none;
    }

    .terminal-input:focus,
    .terminal-select:focus {
      border-color: var(--fg-bright);
      box-shadow: 0 0 8px rgba(0, 255, 65, 0.35);
    }

    .terminal-input {
      min-width: 250px;
    }

    .terminal-btn {
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .terminal-btn:hover,
    .terminal-btn.active {
      background: var(--fg-primary);
      color: var(--bg-core);
      border-color: var(--fg-primary);
      box-shadow: 0 0 10px rgba(0, 255, 65, 0.45);
    }

    .nav-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--border-green);
    }

    .nav-pill {
      background: var(--bg-panel);
      color: var(--fg-muted);
      border: 1px solid var(--border-green);
      padding: 4px 10px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .nav-pill:hover,
    .nav-pill.active {
      color: var(--bg-core);
      background: var(--fg-primary);
      border-color: var(--fg-primary);
      font-weight: 700;
    }

    /* Main Container & Column Sticky Headers */
    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 18px 20px;
    }

    .lang-banner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
      padding: 10px 14px;
      background: var(--bg-panel);
      border: 1px solid var(--fg-muted);
    }

    .lang-col-header {
      font-size: 1rem;
      font-weight: 700;
      color: var(--fg-bright);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-left: 4px solid var(--fg-primary);
      padding-left: 10px;
    }

    .lang-col-header span.sub {
      font-size: 0.78rem;
      color: var(--fg-muted);
      font-weight: 400;
    }

    /* Category Section */
    .category-section {
      margin-bottom: 34px;
      scroll-margin-top: 140px;
    }

    .category-banner {
      background: linear-gradient(90deg, rgba(0, 255, 65, 0.16) 0%, rgba(8, 16, 8, 0.2) 100%);
      border-left: 4px solid var(--fg-primary);
      border-top: 1px solid var(--border-green);
      border-bottom: 1px solid var(--border-green);
      padding: 8px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-banner h2 {
      font-size: 1.05rem;
      color: var(--fg-bright);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .category-banner span {
      font-size: 0.76rem;
      color: var(--fg-muted);
    }

    /* Side-by-Side Comparison Row */
    .comparison-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
      align-items: stretch;
    }

    .lang-cell {
      background: var(--bg-card);
      border: 1px solid var(--border-green);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 14px;
      position: relative;
      transition: border-color 0.15s ease;
    }

    .lang-cell:hover {
      border-color: var(--fg-muted);
    }

    .cell-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border-green);
      padding-bottom: 6px;
    }

    .cell-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .lang-tag {
      font-size: 0.68rem;
      color: var(--fg-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .cell-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--fg-bright);
    }

    .badges-wrap {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .scope-badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border: 1px solid var(--accent-amber);
      color: var(--accent-amber);
      background: rgba(255, 176, 0, 0.08);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .scope-badge[data-scope="FUNCTION / METHOD"] {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      background: rgba(0, 229, 255, 0.08);
    }

    .scope-badge[data-scope="CLASS / MODULE"] {
      border-color: #ff6ec7;
      color: #ff6ec7;
      background: rgba(255, 110, 199, 0.08);
    }

    .scope-badge[data-scope="WHOLE SCRIPT"] {
      border-color: var(--fg-primary);
      color: var(--fg-primary);
      background: rgba(0, 255, 65, 0.1);
    }

    .cell-desc {
      font-size: 0.8rem;
      color: var(--fg-muted);
      margin-bottom: 10px;
    }

    .code-wrapper {
      position: relative;
      background: var(--bg-code);
      border: 1px solid var(--border-green);
      margin-top: auto;
    }

    .code-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 255, 65, 0.06);
      border-bottom: 1px solid var(--border-green);
      padding: 4px 10px;
      font-size: 0.72rem;
      color: var(--fg-muted);
    }

    .copy-btn {
      background: transparent;
      color: var(--fg-primary);
      border: 1px solid var(--fg-muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 2px 8px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .copy-btn:hover {
      background: var(--fg-primary);
      color: var(--bg-core);
    }

    .copy-btn.copied {
      background: var(--accent-amber);
      color: var(--bg-core);
      border-color: var(--accent-amber);
    }

    pre {
      padding: 10px 12px;
      overflow-x: auto;
      font-size: 0.79rem;
      line-height: 1.45;
      color: var(--fg-bright);
      tab-size: 4;
    }

    code {
      font-family: var(--font-mono);
      white-space: pre;
    }

    .hidden {
      display: none !important;
    }

    .site-map-wrap {
      overflow-x: auto;
      padding: 10px;
      background: var(--bg-code);
      border: 1px solid var(--border-green);
    }

    .site-map {
      display: block;
      width: 100%;
      height: auto;
    }

    .site-map .map-edge {
      stroke: var(--fg-muted);
      stroke-width: 2;
      opacity: 0.65;
    }

    .site-map .map-node rect {
      fill: var(--bg-card);
      stroke: var(--fg-primary);
      stroke-width: 2;
      rx: 5;
    }

    .site-map .map-node text {
      fill: var(--fg-bright);
      font: 10px var(--font-mono);
      text-anchor: middle;
    }

    .site-map .map-node:hover rect,
    .site-map .map-node:focus rect {
      fill: var(--border-green);
      stroke: var(--accent-amber);
    }

    .map-legend,
    .flashcard-hint {
      color: var(--fg-muted);
      font-size: 0.78rem;
      margin-top: 8px;
    }

    .flashcard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 12px;
    }

    .flashcard-card {
      background: var(--bg-card);
      border: 1px solid var(--border-green);
      padding: 12px;
      min-height: 150px;
    }

    .flashcard-toggle {
      display: block;
      width: 100%;
      background: transparent;
      color: var(--fg-bright);
      border: 0;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .flashcard-toggle:focus-visible {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 3px;
    }

    .flashcard-topic {
      display: block;
      color: var(--accent-amber);
      font-size: 0.72rem;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .flashcard-question {
      display: block;
      font-weight: 700;
    }

    .flashcard-answer {
      border-top: 1px dashed var(--border-green);
      color: var(--fg-muted);
      font-size: 0.8rem;
      margin-top: 10px;
      padding-top: 9px;
    }

    .flashcard-answer strong {
      color: var(--fg-bright);
    }

    .flashcard-answer p + p {
      margin-top: 6px;
    }

    .flashcard-takeaway {
      color: var(--accent-cyan);
      margin-top: 8px !important;
    }

    .comparison-row.flashcard-row {
      display: block;
    }

    /* Responsive collapse for narrow screens */
    @media (max-width: 980px) {

      .comparison-row,
      .lang-banner {
        grid-template-columns: 1fr;
      }
    }

    /* PRINT MEDIA QUERIES FOR CLEAN EXPORT / PAPER PRINTING */
    @media print {
      @page {
        margin: 10mm;
      }

      body {
        background: #ffffff !important;
        color: #17351d !important;
        font-size: 9.5pt !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .terminal-header .controls-row,
      .terminal-header .nav-pills,
      .copy-btn,
      .brand-title span.cursor {
        display: none !important;
      }

      .terminal-header {
        position: static !important;
        background: #ffffff !important;
        border-bottom: 2px solid #247a36 !important;
        box-shadow: none !important;
        padding: 4px 0 8px 0 !important;
        margin-bottom: 10px !important;
      }

      .brand-title {
        color: #176b2c !important;
        text-shadow: none !important;
        font-size: 14pt !important;
      }

      .container {
        max-width: 100% !important;
        padding: 0 !important;
      }

      .lang-banner {
        grid-template-columns: 1fr 1fr !important;
        background: #eef7ef !important;
        border: 1px solid #54965f !important;
        margin-bottom: 10px !important;
        padding: 6px 10px !important;
      }

      .lang-col-header,
      .lang-col-header span.sub,
      .category-banner h2,
      .category-banner span,
      .cell-title,
      .cell-desc,
      .lang-tag {
        color: #244b2c !important;
      }

      .category-banner {
        background: #e5f1e7 !important;
        border: 1px solid #579364 !important;
        border-left: 4px solid #247a36 !important;
        page-break-after: avoid;
        break-after: avoid;
      }

      .comparison-row {
        grid-template-columns: 1fr 1fr !important;
        min-width: 0 !important;
        gap: 10px !important;
        margin-bottom: 10px !important;
        page-break-inside: avoid;
        break-inside: avoid;
      }

      .lang-cell {
        background: #ffffff !important;
        border: 1px solid #718a75 !important;
        padding: 8px !important;
      }

      .scope-badge {
        border: 1px solid #718a75 !important;
        color: #315a38 !important;
        background: #eef7ef !important;
      }

      .code-wrapper {
        background: #f5faf5 !important;
        border: 1px solid #94a797 !important;
      }

      .code-toolbar {
        background: #e8f1e9 !important;
        color: #315a38 !important;
        border-bottom: 1px solid #94a797 !important;
      }

      pre,
      code {
        color: #17351d !important;
        white-space: pre-wrap !important;
        word-break: break-word !important;
        font-size: 8.5pt !important;
      }

      .category-section.print-exclude {
        display: none !important;
      }

      body.print-all .category-section,
      body.print-all .category-section.hidden,
      body.print-all .comparison-row.hidden,
      body.print-selected .category-section.print-selected-section,
      body.print-selected .category-section.print-selected-section.hidden,
      body.print-selected .category-section.print-selected-section .comparison-row.hidden {
        display: block !important;
      }

      body.print-all .comparison-row,
      body.print-selected .category-section.print-selected-section .comparison-row {
        display: grid !important;
      }

      .flashcard-answer[hidden] {
        display: block !important;
      }

      .site-map-wrap {
        overflow: visible !important;
        background: #f5faf5 !important;
        border-color: #94a797 !important;
      }

      .site-map {
        width: 100% !important;
      }

      .site-map .map-node rect {
        fill: #ffffff !important;
        stroke: #247a36 !important;
      }

      .site-map .map-node text {
        fill: #17351d !important;
      }

      .site-map .map-edge {
        stroke: #54965f !important;
      }

      .flashcard-card {
        background: #ffffff !important;
        border-color: #718a75 !important;
      }

      .flashcard-answer {
        color: #315a38 !important;
        border-color: #718a75 !important;
      }

      .flashcard-answer strong {
        color: #244b2c !important;
      }

      body.print-grayscale {
        color: #000000 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      body.print-grayscale .terminal-header,
      body.print-grayscale .lang-banner,
      body.print-grayscale .category-banner,
      body.print-grayscale .lang-cell,
      body.print-grayscale .scope-badge,
      body.print-grayscale .code-wrapper,
      body.print-grayscale .code-toolbar,
      body.print-grayscale .site-map-wrap,
      body.print-grayscale .flashcard-card {
        background: #ffffff !important;
        color: #000000 !important;
        border-color: #444444 !important;
      }

      body.print-grayscale .brand-title,
      body.print-grayscale .lang-col-header,
      body.print-grayscale .lang-col-header span.sub,
      body.print-grayscale .category-banner h2,
      body.print-grayscale .category-banner span,
      body.print-grayscale .cell-title,
      body.print-grayscale .cell-desc,
      body.print-grayscale .lang-tag,
      body.print-grayscale .scope-badge,
      body.print-grayscale .code-toolbar,
      body.print-grayscale pre,
      body.print-grayscale code,
      body.print-grayscale .flashcard-answer,
      body.print-grayscale .flashcard-answer strong,
      body.print-grayscale .flashcard-toggle,
      body.print-grayscale .flashcard-topic,
      body.print-grayscale .map-legend,
      body.print-grayscale .site-map .map-node text {
        color: #000000 !important;
      }

      body.print-grayscale .site-map .map-node rect {
        fill: #ffffff !important;
        stroke: #444444 !important;
      }

      body.print-grayscale .site-map .map-edge {
        stroke: #555555 !important;
      }
    }
  </style>
</head>

<body>

  <header class="terminal-header">
    <div class="header-top">
      <div class="brand-title">
        root@dev-matrix:~# diff --side-by-side C#_NET9 PYTHON_3.13<span class="cursor"></span>
      </div>
      <div class="controls-row">
        <input type="text" id="searchInput" class="terminal-input" placeholder="Search title, DSA, LINQ, keyword..."
          aria-label="Search cheat sheet" />
        <select id="scopeSelect" class="terminal-select" aria-label="Filter by code scope">
          <option value="ALL">SCOPE: ALL LEVELS</option>
          <option value="CLI">SCOPE: CLI</option>
          <option value="SNIPPET">SCOPE: SNIPPET</option>
          <option value="FUNCTION / METHOD">SCOPE: FUNCTION / METHOD</option>
          <option value="CLASS / MODULE">SCOPE: CLASS / MODULE</option>
          <option value="WHOLE SCRIPT">SCOPE: WHOLE SCRIPT</option>
        </select>
        <select id="printScopeSelect" class="terminal-select" aria-label="Choose what to print">
          <option value="all">PRINT: ALL SECTIONS</option>
          <option value="selected">PRINT: SELECTED SECTIONS</option>
          <option value="current">PRINT: CURRENT VIEW</option>
        </select>
        <select id="printSectionsSelect" class="terminal-select print-sections-control" aria-label="Select sections to print" multiple hidden></select>
        <select id="printColorSelect" class="terminal-select" aria-label="Choose print colors">
          <option value="color">PRINT: COLOR</option>
          <option value="grayscale">PRINT: BLACK &amp; WHITE</option>
        </select>
        <button class="terminal-btn" id="resetBtn" type="button">[RESET]</button>
        <button class="terminal-btn" id="printBtn" type="button">[PRINT_DOCUMENT]</button>
      </div>
    </div>
    <nav class="nav-pills" id="categoryNav">
      <button class="nav-pill active" data-cat="ALL">00://ALL_SECTIONS</button>
      <button class="nav-pill" data-cat="bootstrap">01://CLI_BOOTSTRAP</button>
      <button class="nav-pill" data-cat="types">02://TYPES_STRINGS_SLICING</button>
      <button class="nav-pill" data-cat="control">03://FLOW_PATTERN_MATCHING</button>
      <button class="nav-pill" data-cat="functions">04://FUNCS_GENERATORS_OOP</button>
      <button class="nav-pill" data-cat="collections">05://LINQ_COMPREHENSIONS</button>
      <button class="nav-pill" data-cat="io_async">06://IO_ASYNC_CONCURRENCY</button>
      <button class="nav-pill" data-cat="dsa_core">07://DSA_STRUCTURES</button>
      <button class="nav-pill" data-cat="dsa_hard">08://DSA_ROTATIONS_GRAPHS_TRIE</button>
      <button class="nav-pill" data-cat="dsa_more">09://DSA_LISTS_TREES_GRAPHS</button>
      <button class="nav-pill" data-cat="dsa_patterns">10://DSA_ALGORITHM_PATTERNS</button>
      <button class="nav-pill" data-cat="source_files">11://SOURCE_FILES</button>
      <button class="nav-pill" data-cat="site_map">12://SITE_MAP</button>
      <button class="nav-pill" data-cat="flashcards">13://FLASH_CARDS</button>
      <button class="nav-pill" data-cat="imports_api">14://USING_IMPORT_API_TREE</button>
    </nav>
  </header>

  <main class="container">
    <div class="lang-banner">
      <div class="lang-col-header">
        <span>LEFT COLUMN // C# (.NET 8 / 9)</span>
        <span class="sub">Static / JIT &amp; AOT / Strongly Typed</span>
      </div>
      <div class="lang-col-header">
        <span>RIGHT COLUMN // PYTHON (3.12 / 3.13)</span>
        <span class="sub">Dynamic / Type-Hinted / Reference Counted + GC</span>
      </div>
    </div>

    <div id="sheetsRoot"></div>
  </main>

  <script>
    const CHEAT_SHEET_DATA = [
      {
        id: "bootstrap",
        title: "01 // POST-IDE CLI BOOTSTRAP, ENV & ENTRY POINTS",
        subtitle: "Project initialization, dependency management, and top-level execution right after IDE install",
        rows: [
          {
            cs: {
              title: "Project Init, Dependencies & Build CLI",
              scope: "CLI",
              desc: "Scaffolds a solution, console app, xUnit test project, adds NuGet packages, and executes.",
              code: `# Create solution + console app + test project
dotnet new sln -n MatrixCore
dotnet new console -n MatrixCore.App
dotnet sln add MatrixCore.App/MatrixCore.App.csproj

# Install NuGet package & restore
dotnet add MatrixCore.App package Newtonsoft.Json
dotnet build --configuration Release

# Call: dotnet run --project MatrixCore.App`
            },
            py: {
              title: "Virtual Env, Pip Dependencies & Execution CLI",
              scope: "CLI",
              desc: "Creates an isolated virtual environment, activates it, installs packages, and freezes lockfile.",
              code: `# Create & activate virtual environment
python -m venv .venv
# Windows: .venv\\Scripts\\activate | Linux/Mac: source .venv/bin/activate

# Install packages & export requirements
pip install pytest requests
pip freeze > requirements.txt

# Call: python main.py`
            }
          },
          {
            cs: {
              title: "Entry Point & Command-Line Args",
              scope: "WHOLE SCRIPT",
              desc: "Standard Program class with Main method (or top-level statements) parsing CLI arguments and returning exit code.",
              code: `using System;

namespace MatrixCore;

public static void LeftRotateArrayInPlace(int[] arr, int k)

    k %= arr.Length;
    if (k < 0) k += arr.Length;

    Array.Reverse(arr, k, arr.Length - k);
    Array.Reverse(arr, 0, arr.Length);

    // Step 1: Reverse each row left-to-right

public static List<int> LeftTurnSpiralOrder(int[][] grid)
{
    int rows = grid.Length, cols = grid[0].Length;
    bool[,] seen = new bool[rows, cols];
    // CCW Left-Turn vectors: Down(1,0) -> Right(0,1) -> Up(-1,0) -> Left(0,-1)
    int[] dr = [1, 0, -1, 0];
    int[] dc = [0, 1, 0, -1];
    int r = 0, c = 0, dir = 0;
    var result = new List<int>(rows * cols);

    for (int i = 0; i < rows * cols; i++)
    {
        result.Add(grid[r][c]);
        seen[r, c] = true;
        int nr = r + dr[dir], nc = c + dc[dir];
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || seen[nr, nc])
        {
            dir = (dir + 1) % 4; // Execute 90-degree Left Turn
            nr = r + dr[dir];
            nc = c + dc[dir];
        }
        r = nr; c = nc;
    }
    return result;
}

public static int[] NextGreaterElements(int[] nums)
{
    int[] res = new int[nums.Length];
    Array.Fill(res, -1);
    var stack = new Stack<int>(); // Stores indices

    for (int i = 0; i < nums.Length; i++)

using System.Collections.Generic;

public static int[] Dijkstra(int n, List<(int To, int Weight)>[] adj, int src)
{
    int[] dist = new int[n];
    Array.Fill(dist, int.MaxValue);
    dist[src] = 0;

    var pq = new PriorityQueue<int, int>();
    pq.Enqueue(src, 0);

    while (pq.TryDequeue(out int u, out int d))
    {
        if (d > dist[u]) continue; // Skip stale entry
        foreach (var (v, w) in adj[u])
        {
            if (dist[u] + w < dist[v])
            {
                dist[v] = dist[u] + w;
                pq.Enqueue(v, dist[v]);
            }
        }
    }
    return dist;
}

def dijkstra(n: int, adj: list[list[tuple[int, int]]], src: int) -> list[float]:
    dist: list[float] = [float("inf")] * n
    dist[src] = 0
    pq: list[tuple[float, int]] = [(0, src)]

    while pq:
        d, u = heapq.heappop(pq)
        if d > dist[u]:
            continue
        for v, weight in adj[u]:
            if dist[u] + weight < dist[v]:
                dist[v] = dist[u] + weight
                heapq.heappush(pq, (dist[v], v))
    return dist

public sealed class UnionFind(int n)
{
    private readonly int[] _parent = Enumerable.Range(0, n).ToArray();
    private readonly int[] _rank = new int[n];

    public int Find(int i) => _parent[i] == i ? i : (_parent[i] = Find(_parent[i]));

    public bool Union(int a, int b)
    {
        int rootA = Find(a), rootB = Find(b);
        if (rootA == rootB) return false;
        if (_rank[rootA] < _rank[rootB]) (rootA, rootB) = (rootB, rootA);
        _parent[rootB] = rootA;
        if (_rank[rootA] == _rank[rootB]) _rank[rootA]++;
        return true;
    }
}

    def __init__(self, n: int) -> None:
        self.parent = list(range(n))
        self.rank = [0] * n

    def find(self, i: int) -> int:
        if self.parent[i] != i:
            self.parent[i] = self.find(self.parent[i])
        return self.parent[i]

    def union(self, a: int, b: int) -> bool:
        ra, rb = self.find(a), self.find(b)
        if ra == rb:
            return False
        if self.rank[ra] < self.rank[rb]:
            ra, rb = rb, ra
        self.parent[rb] = ra
        if self.rank[ra] == self.rank[rb]:
            self.rank[ra] += 1
        return True

public sealed class Trie
{
    private readonly Dictionary<char, Trie> _children = new();
    private bool _isEnd;

    public void Insert(string word)
    {
        Trie curr = this;
        foreach (char c in word)
        {
            if (!curr._children.TryGetValue(c, out Trie? next))
                curr._children[c] = next = new Trie();
            curr = next;
        }
        curr._isEnd = true;
    }

    public bool Search(string word, bool prefixOnly = false)
    {
        Trie curr = this;
        foreach (char c in word)
        {
            if (!curr._children.TryGetValue(c, out Trie? next)) return false;
            curr = next;
        }
        return prefixOnly || curr._isEnd;
    }
}

{
    var order = new List<int>();
    var seen = new bool[graph.Length];
    var queue = new Queue<int>();
    seen[start] = true;

    while (queue.Count > 0)

def bfs(graph: list[list[int]], start: int) -> list[int]:
    order: list[int] = []
    seen = {start}
    queue = deque([start])
    while queue:
        node = queue.popleft()
        order.append(node)
        for neighbor in graph[node]:
            if neighbor not in seen:
                seen.add(neighbor)
                queue.append(neighbor)
    return order

    int lo = 0, hi = nums.Length;

    if (values.Length < 2) return (int[])values.Clone();
    int mid = values.Length / 2;
    int[] left = MergeSort(values[..mid]);
    int[] right = MergeSort(values[mid..]);
    var merged = new int[values.Length];

    while (i < left.Length && j < right.Length)

    if len(values) < 2:
        return values.copy()
    mid = len(values) // 2
    left, right = merge_sort(values[:mid]), merge_sort(values[mid:])
    merged: list[int] = []
    i = j = 0
    while i < len(left) and j < len(right):
        if left[i] <= right[j]:
            merged.append(left[i])
            i += 1
        else:

    var indegree = new int[graph.Length];
    foreach (var edges in graph)
        foreach (int to in edges) indegree[to]++;
    var queue = new Queue<int>(
        Enumerable.Range(0, graph.Length).Where(i => indegree[i] == 0));
    var order = new List<int>();
    while (queue.Count > 0)
    {
        int node = queue.Dequeue();
        order.Add(node);
        foreach (int to in graph[node])
            if (--indegree[to] == 0) queue.Enqueue(to);
    }
    return order.Count == graph.Length ? order : null;

def topological_sort(graph: list[list[int]]) -> list[int] | None:
    indegree = [0] * len(graph)
    for edges in graph:
        for target in edges:
            indegree[target] += 1
    queue = deque(i for i, degree in enumerate(indegree) if degree == 0)
    order: list[int] = []
    while queue:
        node = queue.popleft()
        order.append(node)
        for target in graph[node]:
            indegree[target] -= 1
            if indegree[target] == 0:
                queue.append(target)
    return order if len(order) == len(graph) else None`

        for (int cap = capacity; cap >= weights[item]; cap--)
            best[cap] = Math.Max(best[cap],

    return best[capacity];

    best = [0] * (capacity + 1)
    for weight, value in zip(weights, values, strict=True):
        for cap in range(capacity, weight - 1, -1):
            best[cap] = max(best[cap], best[cap - weight] + value)
    return best[capacity]

        }).join("");

        return `
          <section class="category-section" id="section-${cat.id}" data-section-cat="${cat.id}">
            <div class="category-banner">
              <h2>${escapeHtml(cat.title)}</h2>
              <span>${escapeHtml(cat.subtitle)}</span>
            </div>
            ${rowsHtml}
          </section>
        `;
      }).join("");
      root.innerHTML = `${renderSiteMap()}${sheetsHtml}${renderFlashcards()}`;
    }

    function populatePrintSections() {
      const select = document.getElementById("printSectionsSelect");
      const options = Array.from(document.querySelectorAll(".category-section"))
        .map(section => {
          const option = document.createElement("option");
          option.value = section.dataset.sectionCat;
          option.textContent = section.querySelector(".category-banner h2").textContent;
          return option;
        });
      select.replaceChildren(...options);
    }

    function preparePrint() {
      const mode = document.getElementById("printScopeSelect").value;
      const selectedCategories = new Set(
        Array.from(document.getElementById("printSectionsSelect").selectedOptions, option => option.value)
      );
      const sections = Array.from(document.querySelectorAll(".category-section"));

      if (mode === "selected" && selectedCategories.size === 0) {
        window.alert("Select one or more sections to print.");
        return false;
      }

      if (mode === "current" && !document.querySelector(".category-section:not(.hidden) .comparison-row:not(.hidden)")) {
        window.alert("The current filters show no results to print.");
        return false;
      }

      document.body.classList.remove("print-all", "print-selected", "print-grayscale");
      document.body.classList.add(mode === "all" ? "print-all" : mode === "selected" ? "print-selected" : "print-current");
      if (document.getElementById("printColorSelect").value === "grayscale") {
        document.body.classList.add("print-grayscale");
      }

      sections.forEach(section => {
        const isSelected = selectedCategories.has(section.dataset.sectionCat);
        section.classList.toggle("print-exclude", mode === "selected" && !isSelected);
        section.classList.toggle("print-selected-section", mode === "selected" && isSelected);
      });

      return true;
    }

    function clearPrintState() {
      document.body.classList.remove("print-all", "print-selected", "print-current", "print-grayscale");
      document.querySelectorAll(".category-section").forEach(section => {
        section.classList.remove("print-exclude", "print-selected-section");
      });
    }

    function applyFilters() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const scope = document.getElementById("scopeSelect").value;
      const activePill = document.querySelector(".nav-pill.active");
      const activeCat = activePill ? activePill.dataset.cat : "ALL";

      document.querySelectorAll(".category-section").forEach(sec => {
        const secCat = sec.dataset.sectionCat;
        const catMatches = (activeCat === "ALL" || activeCat === secCat);
        let visibleRows = 0;

        sec.querySelectorAll(".comparison-row").forEach(row => {
          const scopeMatches = (scope === "ALL" || row.dataset.scope === scope);
          const searchMatches = (!query || (row.dataset.search || "").includes(query));
          const show = catMatches && scopeMatches && searchMatches;
          row.classList.toggle("hidden", !show);
          if (show) visibleRows++;
        });

        sec.classList.toggle("hidden", visibleRows === 0);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderSheets();
      populatePrintSections();

      document.getElementById("printScopeSelect").addEventListener("change", (e) => {
        document.getElementById("printSectionsSelect").hidden = e.target.value !== "selected";
      });

      window.addEventListener("afterprint", clearPrintState);

      // Copy button delegation
      document.body.addEventListener("click", async (e) => {
        const mapLink = e.target.closest(".map-node");
        if (mapLink) {
          document.getElementById("searchInput").value = "";
          document.getElementById("scopeSelect").value = "ALL";
          document.querySelectorAll(".nav-pill").forEach(p => p.classList.remove("active"));
          document.querySelector('.nav-pill[data-cat="ALL"]').classList.add("active");
          applyFilters();
        }

        const flipButton = e.target.closest(".flashcard-toggle");
        if (flipButton) {
          const answer = document.getElementById(flipButton.getAttribute("aria-controls"));
          if (answer) {
            const expanded = flipButton.getAttribute("aria-expanded") === "true";
            flipButton.setAttribute("aria-expanded", String(!expanded));
            answer.hidden = expanded;
            flipButton.querySelector(".flashcard-hint").textContent = expanded ? "[REVEAL ANSWER]" : "[HIDE ANSWER]";
          }
          return;
        }
        const btn = e.target.closest(".copy-btn");
        if (!btn) return;
        const targetId = btn.getAttribute("data-target");
        const codeEl = document.getElementById(targetId);
        if (!codeEl) return;

        try {
          await navigator.clipboard.writeText(codeEl.textContent);
          const original = btn.textContent;
          btn.textContent = "[COPIED_OK]";
          btn.classList.add("copied");
          setTimeout(() => {
            btn.textContent = original;
            btn.classList.remove("copied");
          }, 1400);
        } catch (err) {
          btn.textContent = "[ERR_COPY]";
        }
      });

      // Category Navigation Pills
      document.getElementById("categoryNav").addEventListener("click", (e) => {
        const pill = e.target.closest(".nav-pill");
        if (!pill) return;
        document.querySelectorAll(".nav-pill").forEach(p => p.classList.remove("active"));
        pill.classList.add("active");
        applyFilters();
      });

      // Search & Scope Filter
      document.getElementById("searchInput").addEventListener("input", applyFilters);
      document.getElementById("scopeSelect").addEventListener("change", applyFilters);

      // Reset Filters
      document.getElementById("resetBtn").addEventListener("click", () => {
        document.getElementById("searchInput").value = "";
        document.getElementById("scopeSelect").value = "ALL";
        document.querySelectorAll(".nav-pill").forEach(p => p.classList.remove("active"));
        document.querySelector('.nav-pill[data-cat="ALL"]').classList.add("active");
        applyFilters();
      });

      // Print Button
      document.getElementById("printBtn").addEventListener("click", () => {
        if (!preparePrint()) return;
        window.print();
      });
    });
  </script>
</body>

</html>
